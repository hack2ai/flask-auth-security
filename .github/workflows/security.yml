name: Security and Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/security.yml'

permissions:
  contents: read

env:
  SECRET_KEY: ci-test-secret
  DATABASE_PATH: ${{ github.workspace }}/database/ci_users.db

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run Bandit on application code
        run: bandit -r app.py config.py database -x tests,test_register.py,test_security_suite.py
